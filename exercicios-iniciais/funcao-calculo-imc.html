<meta charset="UTF-8">

<script>
    //Capítulo 3//

    var mostra = function (frase){
        document.write(frase);
    };
    var calculaIMC = function (altura,peso){
        var imc = peso / (altura*altura);
        mostra("O IMC calculado é: " + imc);
    };

    var pesoDoPrimo = 83;
    var alturaDoPrimo = 1.76;
    calculaIMC(alturaDoPrimo,pesoDoPrimo);
</script>
