<meta charset="UTF-8">

<script>
    //Capítulo 3//
    //Cálculo do IMC V1//

    var mostra = function (frase){
        document.write(frase);
    };
    var pulaLinha = function(){
        document.write("<br><br>");
    };
    var calculaIMC = function (altura,peso){
        var imc = peso / (altura*altura);
        mostra ("V1");
        pulaLinha ();
        mostra("O IMC calculado é: " + imc);
    };

    var pesoDoPrimo = 83;
    var alturaDoPrimo = 1.76;
    calculaIMC(alturaDoPrimo,pesoDoPrimo);
</script>

<script>
    //Cálculo do IMC V2//
    var mostra = function (frase){
        document.write(frase);
    };
    var pulaLinha = function(){
        document.write("<br><br>");
    };
    var pulaLinhaEstilizada = function(){
        document.write("<hr>");
    };
    var calculaIMC = function (altura,peso){
        var imc = peso / (altura*altura);
        return imc;
    };

    var pesoDoPrimo = 83;
    var alturaDoPrimo = 1.76;
    var imcDoPrimo = calculaIMC(alturaDoPrimo, pesoDoPrimo);

    pulaLinhaEstilizada ();
    mostra ("V2");
    pulaLinha ();
    mostra ("O IMC do meu primo é: " + imcDoPrimo);
    pulaLinha ();
    mostra ("Ele ainda está " + (imcDoPrimo - 18.5) + " pontos acima do limite de da magreza.");
    pulaLinhaEstilizada ();
</script>

<script>
    // Cálculo do IMC V3//

    var mostra = function(frase){

    };
    var pulaLinhaEstilizada = function (){
        document.write("<hr>");
    };
    var calculaIMC = function (altura,peso){
        var imc = peso / (altura*altura);

    var meuPeso = 45;
