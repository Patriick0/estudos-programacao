<script>
    var pulaLinhaEstilizada = function(){
        document.write("<hr><br><hr>");
    };

    var mostra = function(frase){
        document.write("<big>" + frase + "</big>");
        pulaLinhaEstilizada();
    };

    var ano = 2026;

    mostra ("Eu nasci em: " + (ano - 27));

    mostra ("Lucas nasceu em: " + (ano - 30));
   
</script>
