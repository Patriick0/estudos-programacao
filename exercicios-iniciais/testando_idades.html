<meta charset="UTF-8">

<script>
    document.write("Minha idade é:" + 25 + "<br>");
    document.write("A soma das nossas idades é: <br>");
    document.write(25+32+26 + "<br>");
    document.write("A média das nossas idades é: " + ((25+32+26)/3) + "<br>");
    document.write("A diferença das nossas idades é: " + (27-21) + "<br>");
    document.write("Já se passaram " + (2026/28).toFixed(2) + " gerações desde o ano zero.");

    /*
    Métodos de arredondamento:
        Método .toFixed()
        document.write("Já se passaram " + (2026/28).toFixed(2) + " gerações desde o ano zero.");
        
        Outras opções:

        Math.floor() → arredonda para baixo (72.99 vira 72)
        Math.ceil() → arredonda para cima (72.01 vira 73)
        Math.round() → arredonda normalmente (72.5 vira 73)
    */

</script>
